name: Build onyx Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: onyx-v-oss
          fetch-depth: 1
          path: kernel

      - name: Clone ReSukiSU
        run: |
          cd $GITHUB_WORKSPACE
          GH_PROXY="https://ghfast.top/"
          git clone --depth 1 -b "main" "${GH_PROXY}https://github.com/ReSukiSU/ReSukiSU.git" ReSukiSU || \
          git clone --depth 1 -b "main" "https://github.com/ReSukiSU/ReSukiSU.git" ReSukiSU

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl zip bison gperf build-essential python3-pip bc cpio unzip libc6-dev-arm64-cross clang llvm lld flex libelf-dev device-tree-compiler gcc-multilib

      - name: Integrate ReSukiSU
        run: |
          cd $GITHUB_WORKSPACE/kernel
          cp -r "$GITHUB_WORKSPACE/ReSukiSU" ./KernelSU
          DRIVER_DIR=drivers
          ln -sf ../../KernelSU/kernel "$DRIVER_DIR/kernelsu"
          grep -q "kernelsu" "$DRIVER_DIR/Makefile" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_DIR/Makefile"
          grep -q "drivers/kernelsu/Kconfig" "$DRIVER_DIR/Kconfig" || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" "$DRIVER_DIR/Kconfig"

      - name: Configure defconfig
        run: |
          cd $GITHUB_WORKSPACE/kernel
          DEFCONFIG=$(find arch/arm64/configs -name "*onyx*" | head -1)
          [ -z "$DEFCONFIG" ] && DEFCONFIG="arch/arm64/configs/vendor/onyx_defconfig"
          printf "\n# KernelSU/SUSFS\nCONFIG_KSU=y\nCONFIG_KSU_SUSFS=y\nCONFIG_KSU_KPROBES_HOOK=y\nCONFIG_KSU_KPM=y\nCONFIG_KPROBES=y\nCONFIG_KALLSYMS=y\nCONFIG_KALLSYMS_ALL=y\nCONFIG_MODULES=y\nCONFIG_MODULE_UNLOAD=y\nCONFIG_MODULE_SIG=n\n" >> "$DEFCONFIG"

      - name: Download AOSP toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang

      - name: Build kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel
          CLANG_DIR=$(ls -d $GITHUB_WORKSPACE/toolchain/clang/linux-x86/clang-* 2>/dev/null | head -1)
          export PATH="$CLANG_DIR/bin:$PATH"
          if [ -f build_with_bazel.py ]; then
            ./build_with_bazel.py --config=msm.onyx 2>&1 | tee build_log.txt
          else
            make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- "$DEFCONFIG"
            make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)
          fi
          echo "BUILD_DONE=1" >> $GITHUB_ENV

      - name: Package AK3
        if: env.BUILD_DONE == '1'
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git AK3
          BOOT=$(find kernel -name "boot.img" 2>/dev/null | head -1)
          if [ -n "$BOOT" ]; then
            cp "$BOOT" AK3/boot.img
            echo 'KERNEL_IMAGE_NAME="boot.img"' > AK3/anykernel.sh
            echo 'do_nothing="this_stays_here"' >> AK3/anykernel.sh
            echo 'is_supported_device() {' >> AK3/anykernel.sh
            echo '  local device="$(file_getprop /system/build.prop ro.product.device)"' >> AK3/anykernel.sh
            echo '  case "$device" in onyx) return 0;; esac' >> AK3/anykernel.sh
            echo '  return 1' >> AK3/anykernel.sh
            echo '}' >> AK3/anykernel.sh
            echo 'ui_print "onyx ReSukiSU Kernel"' >> AK3/anykernel.sh
            cd AK3 && zip -r9 "../onyx-ReSukiSU-AK3.zip" . -x "*.git*" "README*" "*~"
            echo "AK3_ZIP=$GITHUB_WORKSPACE/onyx-ReSukiSU-AK3.zip" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        if: env.AK3_ZIP != ''
        uses: actions/upload-artifact@v4
        with:
          name: onyx-ReSukiSU-AK3
          path: ${{ env.AK3_ZIP }}
