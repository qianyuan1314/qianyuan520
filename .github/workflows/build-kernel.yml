name: Build onyx Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: onyx-v-oss
          fetch-depth: 1
          path: kernel

      - name: Clone ReSukiSU
        run: |
          cd $GITHUB_WORKSPACE
          GH_PROXY="https://ghfast.top/"
          git clone --depth 1 -b "main" "${GH_PROXY}https://github.com/ReSukiSU/ReSukiSU.git" ReSukiSU || \
          git clone --depth 1 -b "main" "https://github.com/ReSukiSU/ReSukiSU.git" ReSukiSU

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl zip bison gperf build-essential python3-pip python3-mako bc cpio unzip libc6-dev-arm64-cross clang llvm lld flex libelf-dev device-tree-compiler gcc-multilib

      - name: Integrate ReSukiSU
        run: |
          cd $GITHUB_WORKSPACE/kernel
          cp -r "$GITHUB_WORKSPACE/ReSukiSU" ./KernelSU
          DRIVER_DIR=drivers
          ln -sf ../../KernelSU/kernel "$DRIVER_DIR/kernelsu"
          grep -q "kernelsu" "$DRIVER_DIR/Makefile" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_DIR/Makefile"
          grep -q "drivers/kernelsu/Kconfig" "$DRIVER_DIR/Kconfig" || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" "$DRIVER_DIR/Kconfig"

      - name: Configure KSU defconfig
        run: |
          cd $GITHUB_WORKSPACE/kernel
          ONYX_DEFCONFIG=$(find arch/arm64/configs -name "onyx*" ! -name "*consolidate*" | head -1)
          [ -z "$ONYX_DEFCONFIG" ] && ONYX_DEFCONFIG="arch/arm64/configs/vendor/onyx_defconfig"
          echo "Using defconfig: $ONYX_DEFCONFIG"
          printf "\n# KernelSU/SUSFS\nCONFIG_KSU=y\nCONFIG_KSU_SUSFS=y\nCONFIG_KSU_KPROBES_HOOK=y\nCONFIG_KSU_KPM=y\nCONFIG_KPROBES=y\nCONFIG_KALLSYMS=y\nCONFIG_KALLSYMS_ALL=y\nCONFIG_MODULES=y\nCONFIG_MODULE_UNLOAD=y\nCONFIG_MODULE_SIG=n\n" >> "$ONYX_DEFCONFIG"

      - name: Setup bazel
        run: |
          # build_with_bazel.py 期望 bazel 在 <workspace>/tools/bazel
          mkdir -p $GITHUB_WORKSPACE/tools
          cd $GITHUB_WORKSPACE/tools
          curl -L "https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64" -o bazel
          chmod +x bazel
          ./bazel --version || true
          echo "BAZEL_SETUP_DONE=1" >> $GITHUB_ENV

      - name: Build kernel
        if: env.BAZEL_SETUP_DONE == '1'
        run: |
          cd $GITHUB_WORKSPACE/kernel
          ./build_with_bazel.py -t onyx consolidate 2>&1 | tee build_log.txt
          # 只有找到 boot.img 才算成功
          BOOT_FOUND=$(find . -name "boot.img" 2>/dev/null | head -1)
          if [ -n "$BOOT_FOUND" ]; then
            echo "BUILD_DONE=1" >> $GITHUB_ENV
            echo "BOOT_IMG=$BOOT_FOUND" >> $GITHUB_ENV
          else
            echo "构建失败：未找到 boot.img"
            exit 1
          fi

      - name: Package AK3
        if: env.BUILD_DONE == '1'
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git AK3
          BOOT=$(find kernel -name "boot.img" 2>/dev/null | head -1)
          if [ -n "$BOOT" ]; then
            cp "$BOOT" AK3/boot.img
            echo 'KERNEL_IMAGE_NAME="boot.img"' > AK3/anykernel.sh
            echo 'do_nothing="this_stays_here"' >> AK3/anykernel.sh
            echo 'is_supported_device() {' >> AK3/anykernel.sh
            echo '  local device="$(file_getprop /system/build.prop ro.product.device)"' >> AK3/anykernel.sh
            echo '  case "$device" in onyx) return 0;; esac' >> AK3/anykernel.sh
            echo '  return 1' >> AK3/anykernel.sh
            echo '}' >> AK3/anykernel.sh
            echo 'ui_print "onyx ReSukiSU Kernel"' >> AK3/anykernel.sh
            cd AK3 && zip -r9 "../onyx-ReSukiSU-AK3.zip" . -x "*.git*" "README*" "*~"
            echo "AK3_ZIP=$GITHUB_WORKSPACE/onyx-ReSukiSU-AK3.zip" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        if: env.AK3_ZIP != ''
        uses: actions/upload-artifact@v4
        with:
          name: onyx-ReSukiSU-AK3
          path: ${{ env.AK3_ZIP }}
